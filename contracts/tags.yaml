# ═════════════════════════════════════════════════════════════════════════════
# wwtp-iiot — TAG CONTRACT
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH.
#
# Every consumer is generated from or validated against this contract:
#   • InfluxDB 3 table + tag definitions
#   • Couchbase `assets` instrument documents
#   • OPC UA NodeIds and engineering units
#   • Modbus register assignments
#   • Node-RED tag list
#   • TypeScript types in ui/web
#   • sql/_shared/tags.sql
#
# A consistency test (tests/contract) fails if any consumer disagrees.
#
# DESIGN RULES ENCODED HERE
#   1. Tag by IDENTITY, field by VALUE. Never the reverse. A float used as a tag
#      creates a new series per reading (see docs/GLOSSARY.md → cardinality).
#   2. Instrument identity, unit of measure, range, calibration and location live
#      HERE and in Couchbase — NOT in InfluxDB. InfluxDB references by
#      `id` only.
#   3. `state` (equipment run state) is a SEPARATE measurement, not a field on a
#      process measurement. This is what makes state bands under a trend line
#      possible (docs/DESIGN.md).
#   4. Every process measurement carries a `quality` field, carrying the OPC UA
#      StatusCode. Bad data must be visible, not silently averaged.
#   5. Engineering units use UCUM codes where they exist, so unit handling is
#      machine-readable rather than a string convention.
#
# quality values (OPC UA StatusCode, integer):
#   0 = Good · 1 = Uncertain · 2 = Bad
# ═════════════════════════════════════════════════════════════════════════════

version: 1

# ─── The site ────────────────────────────────────────────────────────────────
site:
  id: PLANT-A
  name: "Northgate Water Reclamation Facility"
  # Real plants have a permit. Ours is synthetic but dimensionally plausible.
  permit:
    # Arithmetic mean over the trailing 30 days
    eff_nh4_mg_l_30d_mean: 10.0
    eff_tss_mg_l: 30.0
    eff_ph_min: 6.0
    eff_ph_max: 9.0
    dis_bacti_geomean: 200
  design:
    design_flow_m3h: 1800
    peak_factor: 2.5

# ─── ISA-95 hierarchy ─────────────────────────────────────────────────────────
# The contract asserts instrument IDs match `unit:equipment:instrument` structure.
areas:
  - id: INFLUENT
    name: Influent & Lift Station
  - id: PRIMARY
    name: Primary Treatment
  - id: AERATION
    name: Aeration
  - id: SECONDARY
    name: Secondary Clarification
  - id: EFFLUENT
    name: Disinfection & Effluent
  - id: SLUDGE
    name: Sludge & Digestion
  - id: UTILITY
    name: Plant Utilities
  - id: SITE
    name: Site & Environment

# ─── Equipment ───────────────────────────────────────────────────────────────
# `fail_modes` drives the fault library: a fault may target specific equipment.
equipment:
  - { id: SCREEN-1, area: INFLUENT, name: "Bar Screen 1", type: motor, rated_kw: 3.0 }
  - { id: SCREEN-2, area: INFLUENT, name: "Bar Screen 2", type: motor, rated_kw: 3.0 }
  - { id: PIT-1,    area: INFLUENT, name: "PIT 1", type: pump, rated_kw: 22.0, duty: lead }
  - { id: PIT-2,    area: INFLUENT, name: "PIT 2", type: pump, rated_kw: 22.0, duty: lag }
  - { id: PIT-3,    area: INFLUENT, name: "PIT 3", type: pump, rated_kw: 30.0, duty: standby }
  - { id: GRIT-1,   area: INFLUENT, name: "Grit Pump 1", type: pump, rated_kw: 7.5 }
  - { id: PRI-CL-1, area: PRIMARY, name: "Primary Clarifier 1", type: clarifier }
  - { id: PRI-SCR-1, area: PRIMARY, name: "Primary Scraper 1", type: drive, rated_kw: 1.5 }
  - { id: THK-1,    area: SLUDGE, name: "Gravity Thickener 1", type: thickener }
  - { id: AHU-1,    area: AERATION, name: "Aeration Basin 1", type: basin, volume_m3: 8500 }
  - { id: RAS-P-1,  area: AERATION, name: "RAS Pump 1", type: pump, rated_kw: 15.0, duty: lead }
  - { id: RAS-P-2,  area: AERATION, name: "RAS Pump 2", type: pump, rated_kw: 15.0, duty: lag }
  - { id: BLW-1,    area: AERATION, name: "Blower 1", type: blower, rated_kw: 90.0, duty: lead }
  - { id: BLW-2,    area: AERATION, name: "Blower 2", type: blower, rated_kw: 90.0, duty: lag }
  - { id: BLW-3,    area: AERATION, name: "Blower 3", type: blower, rated_kw: 90.0, duty: standby }
  - { id: BLW-4,    area: AERATION, name: "Blower 4", type: blower, rated_kw: 110.0, duty: standby }
  - { id: SEC-CL-1, area: SECONDARY, name: "Secondary Clarifier 1", type: clarifier }
  - { id: SEC-SCR-1, area: SECONDARY, name: "Secondary Scraper 1", type: drive, rated_kw: 2.2 }
  - { id: DIS-CL-2, area: EFFLUENT, name: "Disinfection Contact Basin 2", type: basin }
  - { id: DIG-1,    area: SLUDGE, name: "Anaerobic Digester 1", type: digester, volume_m3: 4200 }
  - { id: GAS-BLR,  area: SLUDGE, name: "Biogas Boiler", type: boiler, rated_kw: 2000 }
  - { id: CL-DOS-1, area: EFFLUENT, name: "Hypochlorite Dosing Skid 1", type: pump, rated_kw: 2.2 }

# ─── Measurements ────────────────────────────────────────────────────────────
# Each entry becomes: an InfluxDB table, a Couchbase instrument document, an
# OPC UA variable, and a Modbus register block.
#
# measurement: InfluxDB table name
#   id:        fully-qualified tag, must appear in `instrument`
#   field:     InfluxDB field name
#   eu:        engineering unit (UCUM where one exists)
#   range:     [hard_min, hard_max] — engineering range for scaling + validation
#   normal:    [expected_low, expected_high] — used by baseline alarms
#   deadband:  minimum meaningful change; suppresses duplicate storage
#   sample_ms: nominal sampling interval
# ─────────────────────────────────────────────────────────────────────────────
measurements:

  # ═══ INFLUENT ═════════════════════════════════════════════════════════════
  # The storm story lives here. Turbidity is the sharpest storm signal.
  - measurement: influent
    area: INFLUENT
    tags: []
    signals:
      - { id: "INFLUENT:FLOW:FLOW",             field: flow_m3h,       eu: "m3/h",   range: [0, 2400],    normal: [200, 2200],  deadband: 5.0,   sample_ms: 1000 }
      - { id: "INFLUENT:FLOW:TURBIDITY",       field: turbidity_ntu,  eu: "NTU",    range: [0, 400],     normal: [5, 80],     deadband: 1.0,   sample_ms: 1000 }
      - { id: "INFLUENT:FLOW:NH4_IN",          field: nh4_mg_l,       eu: "mg/L",   range: [0, 60],      normal: [8, 35],     deadband: 0.1,   sample_ms: 5000 }
      - { id: "INFLUENT:FLOW:TEMP",            field: temp_c,         eu: "Cel",    range: [-5, 40],     normal: [4, 25],     deadband: 0.05,  sample_ms: 5000 }
      - { id: "INFLUENT:FLOW:PH",              field: ph,             eu: "{pH}",   range: [0, 14],      normal: [6.0, 8.5],  deadband: 0.01,  sample_ms: 5000 }
      - { id: "INFLUENT:FLOW:CONDUCTIVITY",    field: conduct_uS_cm,  eu: "uS/cm",  range: [0, 2000],    normal: [200, 900],  deadband: 2.0,   sample_ms: 5000 }

  # ═══ LIFT STATION ═════════════════════════════════════════════════════════
  # Wet well level is the classic lead/lag duty-rotation example.
  - measurement: lift
    area: INFLUENT
    equipment: [PIT-1, PIT-2, PIT-3]
    signals:
      - { id: "INFLUENT:LIFT:WETWELL_LEVEL", field: level_m,     eu: "m",   range: [0, 8],     normal: [1.0, 4.0], deadband: 0.01, sample_ms: 1000 }
      - { id: "INFLUENT:LIFT:CURRENT",       field: current_a,   eu: "A",   range: [0, 120],   normal: [20, 70],   deadband: 0.5,  sample_ms: 1000 }
      # Total wet-well pumping, i.e. all running pumps combined. Sized for peak
      # wet-weather flow (design × peak factor), not for a single pump — a
      # per-pump range here makes the contract reject normal high-flow
      # operation, which is worse than no range at all.
      - { id: "INFLUENT:LIFT:FLOW",          field: flow_m3h,    eu: "m3/h", range: [0, 4800],  normal: [100, 3600], deadband: 2.0,  sample_ms: 1000 }
      - { id: "INFLUENT:LIFT:RUNTIME",       field: runtime_h,   eu: "h",   range: [0, 60000], normal: [0, 60000], deadband: 1.0, sample_ms: 60000 }
      - { id: "INFLUENT:LIFT:STARTS",        field: starts,      eu: "{1}",  range: [0, 100000], normal: [0, 100000], deadband: 1.0, sample_ms: 60000 }

  # ═══ PRIMARY CLARIFIER ════════════════════════════════════════════════════
  # Blanket depth is the constraint: >2 m and sludge washes out to effluent.
  - measurement: primary
    area: PRIMARY
    equipment: [PRI-CL-1, PRI-SCR-1]
    signals:
      - { id: "PRIMARY:PRI-CL-1:BLANKET",    field: blanket_m,     eu: "m",    range: [0, 4],     normal: [0.2, 1.0], deadband: 0.005, sample_ms: 2000 }
      - { id: "PRIMARY:PRI-SCR-1:TORQUE",    field: torque_nm,     eu: "N.m",  range: [0, 500],   normal: [10, 150],  deadband: 0.5,   sample_ms: 1000 }
      - { id: "PRIMARY:PRI-CL-1:UNDERFLOW",  field: underflow_solids_pct, eu: "%", range: [0, 10], normal: [0.5, 4.0], deadband: 0.02, sample_ms: 5000 }
      - { id: "PRIMARY:PRI-CL-1:SLUDGE_RATE", field: sludge_rate_m3h, eu: "m3/h", range: [0, 120], normal: [5, 60], deadband: 0.5, sample_ms: 5000 }
      - { id: "PRIMARY:PRI-CL-1:TEMP",       field: temp_c,        eu: "Cel",  range: [0, 40],   normal: [4, 25],   deadband: 0.05,  sample_ms: 10000 }

  # ═══ AERATION ═════════════════════════════════════════════════════════════
  # The most instrumented unit, and the one that exercises the most failure modes.
  # ae_do vs ae_orch divergence is the model-based (not threshold) detection case.
  - measurement: aeration
    area: AERATION
    equipment: [BLW-1, BLW-2, BLW-3, BLW-4, RAS-P-1, RAS-P-2]
    signals:
      - { id: "AERATION:AHU-1:DO",              field: do_mg_l,        eu: "mg/L", range: [0, 20],     normal: [1.5, 3.0],  deadband: 0.02,  sample_ms: 1000 }
      - { id: "AERATION:AHU-1:SETPOINT_DO",     field: setpoint_do_mg_l, eu: "mg/L", range: [0.5, 6.0], normal: [2.0, 2.0], deadband: 0.01, sample_ms: 5000, writable: true }
      # Total air across all blowers. Capacity is 20 000 m³/h; the normal band is
      # set from the calibrated aeration model, which needs ~2 000–8 000 m³/h
      # (≈2.7 m³ of air per m³ of sewage) to hold a 2.0 mg/L DO setpoint.
      - { id: "AERATION:AHU-1:AIR_FLOW",        field: air_flow_m3h,   eu: "m3/h", range: [0, 26000],  normal: [2000, 14000], deadband: 20.0, sample_ms: 1000 }
      - { id: "AERATION:AHU-1:BLOWER_RPM",      field: blower_rpm,      eu: "rev/min", range: [0, 2400], normal: [600, 1800], deadband: 2.0, sample_ms: 1000 }
      - { id: "AERATION:AHU-1:BLOWER_VALVE",    field: blower_valve_pct, eu: "%",  range: [0, 100],    normal: [20, 90],   deadband: 0.2,  sample_ms: 1000 }
      - { id: "AERATION:AHU-1:NH4_IN",          field: nh4_in_mg_l,     eu: "mg/L", range: [0, 60],   normal: [8, 30],   deadband: 0.1,  sample_ms: 5000 }
      - { id: "AERATION:AHU-1:NH4_OUT",         field: nh4_out_mg_l,    eu: "mg/L", range: [0, 50],   normal: [0.5, 5.0], deadband: 0.1, sample_ms: 5000 }
      - { id: "AERATION:AHU-1:NO3_OUT",         field: no3_out_mg_l,    eu: "mg/L", range: [0, 40],   normal: [1, 20],   deadband: 0.1,  sample_ms: 5000 }
      - { id: "AERATION:AHU-1:MLSS",            field: mlss_mg_l,       eu: "mg/L", range: [500, 8000], normal: [1500, 5000], deadband: 10.0, sample_ms: 60000 }
      - { id: "AERATION:AHU-1:ORCH",            field: orch_mg_l_h,     eu: "mg/(L.h)", range: [0, 400], normal: [50, 300], deadband: 0.5, sample_ms: 60000 }
      - { id: "AERATION:AHU-1:WTEMP",           field: wtemp_c,         eu: "Cel",  range: [0, 40], normal: [8, 22],  deadband: 0.05, sample_ms: 10000 }
      - { id: "AERATION:AHU-1:PH",              field: ph,             eu: "{pH}", range: [0, 14], normal: [6.0, 9.0], deadband: 0.01, sample_ms: 10000 }
      - { id: "AERATION:AHU-1:SRT",             field: srt_d,          eu: "d",    range: [1, 40], normal: [8, 25],  deadband: 0.5,  sample_ms: 3600000 }
      - { id: "AERATION:AHU-1:WASTE_RATE",      field: was_m3h,        eu: "m3/h", range: [0, 200], normal: [5, 80], deadband: 0.5, sample_ms: 60000 }

  # ═══ SECONDARY CLARIFIER ═══════════════════════════════════════════════════
  - measurement: secondary
    area: SECONDARY
    equipment: [SEC-CL-1, SEC-SCR-1]
    signals:
      - { id: "SECONDARY:SEC-CL-1:BLANKET", field: blanket_m,   eu: "m",   range: [0, 3],   normal: [0.2, 0.8], deadband: 0.005, sample_ms: 2000 }
      - { id: "SECONDARY:SEC-SCR-1:TORQUE", field: torque_nm,   eu: "N.m", range: [0, 500], normal: [10, 150], deadband: 0.5,   sample_ms: 1000 }
      - { id: "SECONDARY:SEC-CL-1:OVERFLOW", field: overflow_solids_mg_l, eu: "mg/L", range: [0, 200], normal: [20, 80], deadband: 0.5, sample_ms: 5000 }
      - { id: "SECONDARY:SEC-CL-1:TEMP",    field: temp_c,      eu: "Cel", range: [0, 40], normal: [4, 25],  deadband: 0.05,  sample_ms: 10000 }

  # ═══ EFFLUENT & DISINFECTION ═══════════════════════════════════════════════
  # These carry the PERMIT. sec_eff_nh4 breaches are 30-day rolling means, so no
  # point threshold can ever detect them — see sql/03-advanced.
  - measurement: effluent
    area: EFFLUENT
    equipment: [DIS-CL-2, CL-DOS-1]
    signals:
      - { id: "EFFLUENT:FLOW:FLOW",           field: flow_m3h,        eu: "m3/h", range: [0, 2600],  normal: [200, 2300], deadband: 5.0,  sample_ms: 1000 }
      - { id: "EFFLUENT:FLOW:PH",             field: ph,              eu: "{pH}",  range: [0, 14],   normal: [6.0, 9.0], deadband: 0.01, sample_ms: 5000 }
      - { id: "EFFLUENT:FLOW:RESIDUAL_CL",    field: residual_cl_mg_l, eu: "mg/L", range: [0, 5],    normal: [0.5, 1.5], deadband: 0.01, sample_ms: 5000 }
      - { id: "EFFLUENT:FLOW:TSS",            field: tss_mg_l,        eu: "mg/L", range: [0, 200],   normal: [5, 30],   deadband: 0.5,  sample_ms: 5000 }
      - { id: "EFFLUENT:FLOW:TURBIDITY",      field: turbidity_ntu,   eu: "NTU",   range: [0, 100],   normal: [1, 20],   deadband: 0.1,  sample_ms: 5000 }
      - { id: "EFFLUENT:FLOW:NH4",            field: nh4_mg_l,        eu: "mg/L", range: [0, 30],   normal: [0.5, 8],  deadband: 0.1,  sample_ms: 5000 }
      - { id: "EFFLUENT:FLOW:TEMP",           field: temp_c,          eu: "Cel",  range: [0, 40],   normal: [4, 25],   deadband: 0.05, sample_ms: 5000 }
      - { id: "EFFLUENT:FLOW:CONDUCTIVITY",   field: conduct_uS_cm,   eu: "uS/cm", range: [0, 2000], normal: [200, 900], deadband: 2.0,  sample_ms: 5000 }
      - { id: "EFFLUENT:DIS-CL-2:BACTI",      field: bacti_mpn_100ml, eu: "{MPN}/100mL", range: [10, 10000], normal: [10, 500], deadband: 1.0, sample_ms: 3600000 }

  # ═══ SLUDGE & DIGESTION ═══════════════════════════════════════════════════
  # The second process, and the souring case. pH < 6.5 with VFA/alk > 0.6 is
  # the digester-health signal pair.
  - measurement: sludge
    area: SLUDGE
    equipment: [THK-1, DIG-1, GAS-BLR]
    signals:
      - { id: "SLUDGE:THK-1:TS",             field: ts_pct,            eu: "%",     range: [0, 10],   normal: [0.5, 5.0], deadband: 0.01, sample_ms: 10000 }
      - { id: "SLUDGE:DIG-1:PH",             field: ph,                eu: "{pH}",  range: [4, 9],    normal: [6.8, 7.4], deadband: 0.005, sample_ms: 60000 }
      - { id: "SLUDGE:DIG-1:ALKALINITY",     field: alkalinity_mg_l,   eu: "mg/L",  range: [0, 8000], normal: [2000, 5500], deadband: 5.0, sample_ms: 3600000 }
      - { id: "SLUDGE:DIG-1:VFA_ALK_RATIO",   field: vfa_alk_ratio,     eu: "1",     range: [0, 2],    normal: [0.1, 0.4], deadband: 0.005, sample_ms: 3600000 }
      - { id: "SLUDGE:DIG-1:TEMP",           field: temp_c,            eu: "Cel",   range: [20, 50],  normal: [35, 40],  deadband: 0.05, sample_ms: 60000 }
      - { id: "SLUDGE:DIG-1:GAS_FLOW",       field: gas_flow_m3h,      eu: "m3/h",  range: [0, 2500], normal: [300, 1800], deadband: 2.0, sample_ms: 60000 }
      - { id: "SLUDGE:DIG-1:CH4",            field: ch4_pct,           eu: "%",     range: [0, 100],  normal: [55, 72],  deadband: 0.1,  sample_ms: 60000 }
      - { id: "SLUDGE:DIG-1:GAS_PRESSURE",   field: gas_pressure_mbar, eu: "mbar",  range: [0, 300],  normal: [50, 220],  deadband: 0.5,  sample_ms: 60000 }
      - { id: "SLUDGE:GAS-BLR:BOILER_DUTY",  field: boiler_duty_kw,    eu: "kW",    range: [0, 2200], normal: [200, 1900], deadband: 1.0, sample_ms: 60000 }

  # ═══ PLANT UTILITIES ══════════════════════════════════════════════════════
  - measurement: utility
    area: UTILITY
    signals:
      - { id: "UTILITY:SITE:PLANT_POWER", field: power_kw, eu: "kW", range: [0, 2500], normal: [200, 1800], deadband: 1.0, sample_ms: 1000 }

  # ═══ SITE & WEATHER ═══════════════════════════════════════════════════════
  # site_rain is the trigger the storm fault uses.
  - measurement: site
    area: SITE
    signals:
      - { id: "SITE:WEATHER:AIR_TEMP", field: air_temp_c, eu: "Cel",  range: [-30, 55], normal: [5, 30],   deadband: 0.1,  sample_ms: 60000 }
      - { id: "SITE:WEATHER:RAIN",     field: rain_mm_h,  eu: "mm/h", range: [0, 200],  normal: [0, 1],   deadband: 0.1,  sample_ms: 60000 }
      - { id: "SITE:WEATHER:BARO",     field: baro_hpa,   eu: "hPa",  range: [900, 1100], normal: [990, 1035], deadband: 0.1, sample_ms: 60000 }
      # **Not writable, and it said `writable: true` until the write-back path
      # was built.** `InfluentUnit.storm_active` is not a latch: `storm_age_s` is
      # measured from `storm_started_s`, and `_diurnal()` clears the flag itself
      # once `storm_age_s > storm_duration_s` (`units.py:285`). So a register write
      # setting it would clear itself on the next scan — a write that reports
      # success and does nothing, which is worse than one that is refused.
      #
      # Arming a storm is `start_storm(duration_s=...)`, which sets three fields
      # together, and it models weather rather than accepting a command. Marking
      # it read-only is the honest description of what it is; `softplc/main.py`
      # has `inject_storm` for the demo path.
      - { id: "SITE:WEATHER:STORM",    field: storm_flag, eu: "{Boolean}", range: [0, 1], normal: [0, 0], deadband: 0.5, sample_ms: 1000, writable: false }

# ─── Equipment state ─────────────────────────────────────────────────────────
# SEPARATE from process measurements by design. This is what makes state bands
# under a trend line possible in the UI (docs/DESIGN.md, rule 3).
#
# state values: 0 = stopped · 1 = running · 2 = fault · 3 = standby
# ─────────────────────────────────────────────────────────────────────────────
state_equipment: [PIT-1, PIT-2, PIT-3, SCREEN-1, SCREEN-2, GRIT-1, PRI-CL-1, PRI-SCR-1,
                  THK-1, RAS-P-1, RAS-P-2, BLW-1, BLW-2, BLW-3, BLW-4,
                  SEC-CL-1, SEC-SCR-1, DIS-CL-2, CL-DOS-1, DIG-1, GAS-BLR]

# ─── Modbus register map ─────────────────────────────────────────────────────
# Deliberately includes traps — see docs/DESIGN.md:
#   • BLOWER_VALVE and WASTE_RATE are low-word-first, everything else is
#     high-word-first. The gateway must handle both or produce garbage.
#   • FAULT_CODE is int16 holding values that overflow if read as float32.
#   • HEARTBEAT increments every scan; proves liveness and detects a stuck client.
#
# `signal:` names the measurement a register carries, and it is what lets the
# gateway publish Modbus readings at all. A register name identifies a
# *location*, not a measurement: the only way to derive the correspondence from
# names is to substring-match, and that is right by luck and wrong by design,
# because a register is a *view* of a subset of signals.
#
# Registers with no `signal:` are deliberately not measurements. HEARTBEAT is
# liveness. FAULT_CODE and EQUIP_STATE_WORD are plant-wide state, not a reading.
# The PUMP1_RUNTIME pair is one 32-bit value that Modbus has no type for, and
# this register model has no concept of a straddled value — so it is left
# unlinked rather than linked to half of something. Saying "no link" is the
# honest answer; implying one that does not exist is not.
# ─────────────────────────────────────────────────────────────────────────────
modbus:
  endpoint: "tcp://0.0.0.0:5020"
  unit_id: 1
  registers:
    # No signal: liveness, not a measurement.
    - { address: 40000, name: HEARTBEAT,              type: int16,  unit_id: 1, writable: false }
    - { address: 40002, name: INFLUENT_FLOW,          type: float32, word_order: big,    unit_id: 1, writable: false, signal: "INFLUENT:FLOW:FLOW" }
    - { address: 40004, name: INFLUENT_TURBIDITY,     type: float32, word_order: big,    unit_id: 1, writable: false, signal: "INFLUENT:FLOW:TURBIDITY" }
    - { address: 40006, name: INFLUENT_NH4,           type: float32, word_order: big,    unit_id: 1, writable: false, signal: "INFLUENT:FLOW:NH4_IN" }
    - { address: 40100, name: AERATION_DO,            type: float32, word_order: big,    unit_id: 1, writable: false, signal: "AERATION:AHU-1:DO" }
    - { address: 40102, name: AERATION_SETPOINT_DO,   type: float32, word_order: big,    unit_id: 1, writable: true,  signal: "AERATION:AHU-1:SETPOINT_DO" }
    - { address: 40104, name: AERATION_AIR_FLOW,      type: float32, word_order: big,    unit_id: 1, writable: false, signal: "AERATION:AHU-1:AIR_FLOW" }
    - { address: 40106, name: AERATION_MLSS,          type: float32, word_order: big,    unit_id: 1, writable: false, signal: "AERATION:AHU-1:MLSS" }
    # ⚠ TRAP: low word first. Decoded incorrectly, this reads ~0.
    - { address: 40108, name: AERATION_BLOWER_VALVE,  type: float32, word_order: little, unit_id: 1, writable: false, signal: "AERATION:AHU-1:BLOWER_VALVE" }
    - { address: 40200, name: SECONDARY_BLANKET,      type: float32, word_order: big,    unit_id: 1, writable: false, signal: "SECONDARY:SEC-CL-1:BLANKET" }
    - { address: 40202, name: SECONDARY_TORQUE,       type: float32, word_order: big,    unit_id: 1, writable: false, signal: "SECONDARY:SEC-SCR-1:TORQUE" }
    - { address: 40300, name: DIGESTER_PH,            type: float32, word_order: big,    unit_id: 1, writable: false, signal: "SLUDGE:DIG-1:PH" }
    - { address: 40302, name: DIGESTER_CH4,           type: float32, word_order: big,    unit_id: 1, writable: false, signal: "SLUDGE:DIG-1:CH4" }
    # ⚠ TRAP: low word first.
    - { address: 40304, name: AERATION_WASTE_RATE,    type: float32, word_order: little, unit_id: 1, writable: false, signal: "AERATION:AHU-1:WASTE_RATE" }
    # No signal: a plant-wide fault code, not a measurement.
    #
    # **Not writable, and it said `writable: true`.** `RegisterModel.fault_code`
    # is assigned by nothing in the tree (`servers/modbus.py:141` declares it and
    # `:201` publishes it, and no code path ever writes it), so the register
    # reads 0 forever and a write to it would be discarded on the next scan. The
    # "plant-level fault injection" this entry promised is `FaultEngine.arm()`,
    # which takes a fault id and is not reachable from a register.
    - { address: 40350, name: FAULT_CODE,             type: int16,  unit_id: 1, writable: false }
    # Not writable for the reason given on the signal, above.
    - { address: 40351, name: STORM_FLAG,             type: int16,  unit_id: 1, writable: false, signal: "SITE:WEATHER:STORM" }
    # No signal: a bitfield of every state-bearing asset, not a measurement.
    - { address: 40400, name: EQUIP_STATE_WORD,       type: int16,  unit_id: 1, writable: false }
    # No signal: high and low halves of one 32-bit value, reassembled by the
    # client. Linking either half to a signal would be a lie about the other.
    - { address: 40401, name: PUMP1_RUNTIME_HI,       type: uint16, unit_id: 1, writable: false }
    - { address: 40402, name: PUMP1_RUNTIME_LO,       type: uint16, unit_id: 1, writable: false }

# ─── OPC UA address space ────────────────────────────────────────────────────
# Mirrors the ISA-95 hierarchy. NodeIds are generated deterministically from
# signal ids by tools/gen_opcua_model.py — do not hand-write.
# ─────────────────────────────────────────────────────────────────────────────
opcua:
  endpoint: "opc.tcp://0.0.0.0:4840/wwtp/server/"
  namespace_uri: "urn:wwtp:plant:PLANT-A"
  # NodeId scheme: ns=2;s=<Area>.<Unit>.<SignalName>
  # First path component of every signal id becomes the Area folder.
  security:
    # Phase 2 stretch goal, per docs/SECURITY.md — see Known gaps
    mode: None          # None | Sign | SignAndEncrypt
    policy: Basic256Sha256
    # Set true once app-instance certs exist. Not required to run the simulation.
    require_certificates: false

# ─── Writable tags ───────────────────────────────────────────────────────────
# The full write surface. Anything not listed is read-only by contract, and the
# OPC UA server must mark it accordingly. Audit every write to the `events`
# bucket — this is the mechanism a regulated plant would need.
# ─────────────────────────────────────────────────────────────────────────────
# The operator's write surface: **one value.**
#
# This listed three. Two of them could not work and did not — the soft PLC had no
# write-back path at all, so every write was accepted on the wire, never applied,
# and overwritten on the next 20 ms scan. A register that accepts a write and
# discards it is worse than one that refuses it, because the client believes it
# acted.
#
# Narrowed to the setpoint once `softplc/servers/modbus_server.py` had a real
# write-back path. The other two are refused at the protocol boundary now, with a
# Modbus exception, rather than silently swallowed. Both are documented on the
# signal and register entries.
writable:
  - { id: "AERATION:AHU-1:SETPOINT_DO", range: [0.5, 6.0], reason: "Operator DO setpoint change" }
