# ─────────────────────────────────────────────────────────────────────────────
# wwtp-iiot — the whole stack.
#
#   docker compose up -d                    # the six core services
#   docker compose --profile observability up -d   # …plus Grafana
#   docker compose --profile demo up -d           # …plus the history seeder
#
# Read this file as a diagram. Each service states what it depends on and *why*,
# because "depends_on" is the most consequential line in any compose file and the
# one most often written by trial and error.
#
# Design rule that shapes everything below: the two databases are not
# alternatives. InfluxDB 3 answers "what did the dissolved oxygen do at 03:14";
# Couchbase answers "what is AHU-1, which documents describe it, and what
# happened to it last week". Neither can do the other's job well, and running
# both in one process because they happen to both be databases is how a system
# ends up with two half-truths and no way to reconcile them.
# ─────────────────────────────────────────────────────────────────────────────

name: wwtp-iiot

x-python-build: &python-build
  context: .
  dockerfile: docker/Dockerfile.python

# Shared by every Python service. `nonroot` in the image already handles the
# user; this only makes it explicit at the point of use.
# One anchor, not two merged in sequence. Compose's YAML parser rejects a
# sequence-of-maps merge, and splitting "python defaults" from "restart defaults"
# was never worth the cleverness anyway — there is no service that wants one
# without the other.
x-python-service: &python-service
  build: *python-build
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      # Without a cap, a chatty service fills the disk and takes the databases
      # down with it. 10 files x 1 MB is plenty for this project's volume.
      max-size: "10m"
      max-file: "3"

x-restart: &restart
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true

# ═════════════════════════════════════════════════════════════════════════════
# 1. softplc — the plant
# ═════════════════════════════════════════════════════════════════════════════
services:
  softplc:
    <<: *python-service
    container_name: wwtp-softplc
    command:
      - python
      - -m
      - softplc.main
      - --scan-ms=${PLC_SCAN_MS:-20}
      - --modbus-port=5020
      - --opcua-endpoint=opc.tcp://0.0.0.0:4840/wwtp/server/
      - --speed=${PLC_SPEED:-1.0}
      - --report-every=30
    environment:
      # Bind to all interfaces *inside the container*. The service name is what
      # the rest of the network uses; publishing to the host is a separate,
      # deliberate decision made per port below.
      PLC_INSTANCE: PLANT-A
    ports:
      # Host 5020 rather than 502: 502 is privileged, and 502 is also what half
      # the Modbus tooling on a laptop already has bound.
      #
      # `${HOST_BIND:-127.0.0.1}` is the fix `courses/opcua/07-security.md`
      # asks for, and it is a default rather than a policy: the port is published
      # on loopback, so "anyone who can reach the port" means *this machine*.
      #
      # It was `4840:4840` — no host prefix, which Docker reads as every
      # interface — while the comment two lines above claimed that "publishing to
      # the host is a separate, deliberate decision made per port below". Nothing
      # in the repository recorded the decision, and `0.0.0.0` appeared in no
      # markdown file at all, so the claim could not be resolved by reading the
      # project.
      #
      # To expose the plant on a network, set `HOST_BIND=0.0.0.0` in `.env` and
      # understand that the OPC UA endpoint is then **unauthenticated and
      # unencrypted** — `SecurityPolicyNone`, no certificate — and that anyone
      # who can reach it can read the site name, the design flow, all five permit
      # limits and all 57 signals. See docs/SECURITY.md.
      - "${HOST_BIND:-127.0.0.1}:${MODBUS_PORT:-5020}:5020"
      - "${HOST_BIND:-127.0.0.1}:${OPCUA_PORT:-4840}:4840"
    networks: [plant]
    healthcheck:
      # The PLC has no HTTP endpoint — adding one purely for a healthcheck would
      # be a web server nobody asked for. A TCP connect to the Modbus port
      # proves the listener is up, which is the thing that actually matters.
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.create_connection(('127.0.0.1',5020),2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. db — Postgres 16 + TimescaleDB 2.30. One database, not two.
  # ═══════════════════════════════════════════════════════════════════════════
  db:
    <<: *restart
    # Pinned by version *and* by Postgres major, which is a pin that means
    # something. It is worth recording why this line is so much less interesting
    # than the one it replaced.
    #
    # InfluxDB 3 is published to Quay and publishes no semver tags at all — the
    # full list is `latest`, `latest-arm64`, `latest-amd64`, `arm64`, `intel`,
    # and one commit SHA per build. There was no `3.2` to pin, so the service
    # was pinned by commit SHA, which is immutable and correct and tells a
    # reader nothing about what version they are running.
    #
    # This vendor publishes `2.30.1-pg16`, so the version is in the tag, the
    # Postgres major is in the tag, and the digest is available for the
    # deployments that want it. The `-oss` variants are Apache-2.0 only; the
    # plain one is what the continuous aggregates need.
    image: timescale/timescaledb:2.30.1-pg16
    container_name: wwtp-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wwtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
      # The database is the one thing here that genuinely needs to keep working
      # across a restart, and the default is off.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${HOST_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks: [plant]
    healthcheck:
      # `pg_isready` with an explicit `-h 127.0.0.1`, and the `-h` is the point.
      #
      # The Postgres image's entrypoint starts a *temporary* server on a unix
      # socket to run the init scripts, before the real server is ever launched.
      # `pg_isready` with no host connects over that socket and reports
      # "accepting connections" while the image is still initialising — so
      # `depends_on: service_healthy` would let the gateway through to a
      # database that is about to be shut down underneath it. Adding `-h 127.0.0.1`
      # makes the check fail during that window, because the temporary server
      # listens only on the socket.
      #
      # This is the same class of bug as the Couchbase `/pools/default` health
      # check that answered the string `"unknown pool"`: an endpoint that looks
      # like a yes and is not.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ─── one-shot: schema + contract ────────────────────────────────────────────
  #
  # A separate service, and the reason is worth stating: this is not a start-up
  # script inside the `db` container, because overriding that container's
  # `command` replaces the image's entrypoint — which is the server. The exact
  # mistake the deleted `couchbase-init` documented, learned the hard way once
  # already.
  #
  # It runs before the gateway and exits. Everything that writes depends on the
  # `reading` table existing and the contract being in it, because
  # `reading.signal_id` is a foreign key and the database will refuse history
  # for a signal it has never heard of. That refusal is the feature.
  init-db:
    <<: *python-service
    restart: "no"
    container_name: wwtp-init-db
    # Two phases. The schema first, as the owner; then the least-privileged
    # *login* role, which is the only credential the long-running gateway ever
    # sees.
    #
    # Creating the login role here rather than in the image is deliberate: a role
    # needs a password, and a password in a migration is a password in a git
    # history. It comes from the environment and exists only at run time.
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        python -m storage.postgres.schema
        python -m storage.postgres.login_role --name "$${GATEWAY_DB_ROLE}"
        # The dashboard's read-only role. Created here for the same reason as
        # the gateway's and with the same mechanism; the only difference is the
        # group, so the web page cannot write a reading even if someone finds a
        # way to make it try.
        python -m storage.postgres.login_role --name "$${WEB_DB_ROLE}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-wwtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
      RETENTION_RAW_DAYS: ${RETENTION_RAW_DAYS:-7}
      RETENTION_MINUTE_DAYS: ${RETENTION_MINUTE_DAYS:-90}
      # The gateway's login role: LOGIN, member of wwtp_writer, and nothing
      # else. It can insert readings and it cannot delete them.
      GATEWAY_DB_ROLE: ${GATEWAY_DB_ROLE:-wwtp_gateway}
      # Both passwords are required, and `init-db` is the only service that needs
      # both — it creates both login roles. The services themselves each get one
      # (see the `gateway` block below), so there is a single meaning per variable.
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      # The dashboard's read-only role: LOGIN, member of wwtp_reader, and
      # nothing else. No INSERT, no UPDATE, no DELETE, no TRUNCATE.
      WEB_DB_ROLE: ${WEB_DB_ROLE:-wwtp_ui}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [plant]

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. gateway — reads both protocols, applies a deadband, spools, writes.
  # ═══════════════════════════════════════════════════════════════════════════
  gateway:
    <<: *python-service
    container_name: wwtp-gateway
    command: ["python", "-m", "gateway.main"]
    environment:
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-INFO}
      GATEWAY_DEADBAND_DEFAULT: ${GATEWAY_DEADBAND_DEFAULT:-0.0}
      GATEWAY_SPOOL_DIR: /srv/spool
      GATEWAY_SPOOL_MAX_MB: ${GATEWAY_SPOOL_MAX_MB:-512}
      # By *service name*, not localhost. Inside a container, localhost is that
      # container — a mistake that produces a connection-refused loop that looks
      # like a networking problem and is really a naming one.
      MODBUS_HOST: softplc
      MODBUS_PORT: "5020"
      OPCUA_ENDPOINT: opc.tcp://softplc:4840/wwtp/server/
      # The presence of POSTGRES_HOST is what switches the writer on. A gateway
      # with no database still reads the plant and still spools everything, which
      # is not a degraded mode but the one guarantee it exists to provide.
      #
      # These are NOT the owner's credentials. The gateway authenticates as a
      # login role that is a member of `wwtp_writer` and of nothing else, so it
      # can insert a reading and cannot delete one, drop a table, or change the
      # contract. See `storage/postgres/roles.py` and `docs/SECURITY.md` — the
      # previous stack had an equivalent scoped credential and losing it during
      # the InfluxDB-to-Postgres migration was a regression.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${GATEWAY_DB_ROLE:-wwtp_gateway}
      # **The gateway's password comes from `GATEWAY_DB_PASSWORD` and nothing
      # else, and it is required.**
      #
      # This used to be two variables — `GATEWAY_DB_PASSWORD` for the role and
      # `POSTGRES_PASSWORD` for the connection — and the two disagreed the moment
      # anyone set the first, because `storage/postgres/schema.py::dsn()` reads
      # `POSTGRES_PASSWORD` while `login_role.py` reads `GATEWAY_DB_PASSWORD`.
      # Setting the *documented, correct* variable therefore **broke the gateway**:
      #
      #     FATAL: password authentication failed for user "wwtp_gateway"
      #
      # while `init-db` cheerfully logged that it had refreshed the password. The
      # stack only worked because both variables happened to be unset, so both
      # paths used the owner's password and matched by coincidence.
      #
      # One variable, one meaning. `${A:-${B}}` is not used because Compose cannot
      # nest it — it turns the value into a literal string, which this project has
      # already been bitten by — and a *required* variable is the honest answer
      # anyway: a silent fallback to the owner's password is a working
      # configuration that defeats the point of having a scoped credential, and it
      # defeats it invisibly.
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
    volumes:
      # The spool must outlive the container. Without this volume, every restart
      # silently discards the backlog — and the data loss is invisible until
      # someone asks why Tuesday has a four-hour gap.
      - gateway-spool:/srv/spool
    depends_on:
      softplc:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    networks: [plant]
    healthcheck:
      # Prove the *gateway's* write path, not the database's port. A TCP connect
      # to 5432 proves Postgres is listening; it does not prove the schema is
      # applied, that the contract is loaded, or that this container's
      # credentials work. All three were true failures during this migration.
      # Two things, both of which have been a real failure:
      #
      #   1. it can read the contract with *its own* credentials, which proves the
      #      schema is applied, the contract is loaded, and the password is right;
      #   2. it *cannot* TRUNCATE the readings, which proves the role is scoped.
      #
      # The second is the unusual one and it is here on purpose. A health check
      # that only proves connectivity passes happily on a gateway handed the
      # owner's credentials, which is exactly the failure this arrangement exists
      # to prevent.
      #
      # A literal block (`|-`), not a folded one (`>-`). Folding collapses the
      # newlines into spaces, which turns a `try:` on its own line into nonsense
      # and an exception the health check cannot report. The first two versions of
      # this were a folded scalar and a shell `&& ... || ...` chain, and between
      # them they produced three different wrong behaviours: a syntax error, an
      # unreadable condition, and a stderr redirect that made a real connection
      # failure report itself as "scoped". A health check has to be able to say
      # *which* of several things went wrong.
      test:
        - CMD-SHELL
        - |-
          python - <<'EOF'
          import os, sys, psycopg
          c = psycopg.connect(
              host=os.environ["POSTGRES_HOST"],
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
              dbname=os.environ["POSTGRES_DB"],
          )
          cur = c.cursor()
          cur.execute("SELECT count(*) FROM signal")
          print("contract rows:", cur.fetchone()[0])
          try:
              cur.execute("TRUNCATE reading")
          except Exception:
              c.rollback()
              print("scoped: reads the contract, cannot erase history")
              sys.exit(0)
          c.rollback()
          print("NOT SCOPED: the gateway holds owner credentials")
          sys.exit(1)
          EOF
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # 4b. scada — Node-RED, the operator flows
  # ═══════════════════════════════════════════════════════════════════════════
  scada:
    # Profile `scada`. It is the only service here that nothing else depends on
    # and that depends on nothing but the database — the plant, the gateway and
    # the alarm engine all work without it. It is the operator's *view* of them.
    profiles: ["scada"]
    build:
      context: ./scada/nodered
      dockerfile: Dockerfile
    container_name: wwtp-scada
    restart: unless-stopped
    init: true
    # **The flows are mounted at `/flows`, read-only, and the entrypoint builds
    # `/data/flows.json` from them on every start.**
    #
    # Two arrangements were tried and both were wrong:
    #
    # 1. `./scada/flows:/data:ro` with a named volume for the credentials at
    #    `/data/credentials` — **the service cannot start at all.** The
    #    credentials volume is nested inside the read-only mount, so Docker
    #    cannot create the mountpoint:
    #
    #        error mounting ".../scada-credentials/_data" to rootfs at
    #        "/data/credentials": create mountpoint for "/data/credentials":
    #        mkdirat .../data/credentials: read-only file system
    #
    #    And a container that cannot start is the fourth compose file in this
    #    project that ships broken, all four found by running `docker compose up`
    #    rather than by reading the YAML.
    #
    # 2. A named volume over `/data` — which works, and silently *shadows the
    #    image's `settings.js`*, so every setting in it is ignored and nothing
    #    says so. That is the bug `scada/nodered/Dockerfile` already has a
    #    comment about.
    #
    # So: `/data` stays the image's own writable layer, the flows come in
    # read-only at `/flows`, and the entrypoint assembles them. The
    # consequence is that the credential lives in the container rather than in a
    # volume, which means it is regenerated from the environment on a fresh
    # container — arguably better, since there is no stale secret left on disk.
    #
    # And assembling on start is what makes the *combined* file at all: Node-RED
    # loads one `flows.json`, the three generated files are three tabs, and the
    # concatenation is the step that would otherwise be done by hand.
    volumes:
      - ./scada/flows:/flows:ro
    environment:
      NODE_RED_EDITOR: "false"     # the flows are generated; see scada/README.md
      ADMIN_ROOT: ${SCADA_ADMIN_ROOT:-/scada}
      TZ: UTC
      # The database credential is derived from these by the image's entrypoint,
      # so it never appears in a committed file.
      #
      # **The owner's credentials, and that is an asymmetry worth stating rather
      # than hiding.** The gateway authenticates as `wwtp_gateway` and cannot
      # DELETE a reading; the SCADA runtime uses `POSTGRES_USER` and can. The
      # mimic is read-only by construction and the credential is generated per
      # environment, so nothing here can do damage the gateway could not — but
      # "the flows are read-only" is a claim about the flows and not about the
      # credential, and the two are not the same thing. A read-only Postgres role
      # for the SCADA service is the right next step and is not done.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
      POSTGRES_USER: ${POSTGRES_USER:-wwtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MODBUS_HOST: softplc
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
    ports:
      # **Bound to localhost.** The Node-RED editor is an HTTP surface that runs
      # arbitrary JavaScript, and "it is only a dev tool" is how a dev tool ends up
      # on a network.
      - "127.0.0.1:${SCADA_PORT:-18880}:1880"
    depends_on:
      db:
        condition: service_healthy
      softplc:
        condition: service_healthy
    networks: [plant]

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. web — the custom Next.js dashboard
  # ═══════════════════════════════════════════════════════════════════════════
  web:
    # Profile `ui`. The custom operator dashboard — Next.js, server-rendered,
    # reading the database through a server-side pool.
    #
    # **The two `NEXT_PUBLIC_` build args are gone**, and their removal is the
    # design. They were `NEXT_PUBLIC_POSTGRES_URL` and `NEXT_PUBLIC_MODBUS_PORT`,
    # baked into the client bundle, and the Dockerfile's own comment said "the
    # browser cannot keep a secret" while the compose file handed it a database
    # URL. It was only a host and a port, so nothing leaked — but the *pattern*
    # is one argument away from leaking the password, and a reviewer reading
    # `NEXT_PUBLIC_POSTGRES_URL` has no way to know which it is.
    #
    # So the connection details are runtime environment variables, read by the
    # server, and `lib/db.ts` refuses to start without them rather than defaulting
    # to `localhost` — which inside a container resolves to the container, and
    # surfaces as "the database is down" when the truth is "you configured
    # nothing".
    #
    # A note on what this service used to be: it had a correct Dockerfile and no
    # `package.json`, behind this profile, with an accurate service count in
    # every document. **A placeholder that is accounted for is the easiest kind of
    # missing thing to forget** — there was never a moment where anything looked
    # wrong. It also cost this project a compose file that could not start
    # (`failed to calculate cache key: "/package.json": not found`), the fourth
    # such file, all four found by running `docker compose up` rather than by
    # reading the YAML.
    profiles: ["ui"]
    build:
      context: ./ui/web
      dockerfile: Dockerfile
      args:
        # No database arguments. There is nothing to bake, which is the point.
        NEXT_TELEMETRY_DISABLED: "1"
    environment:
      # Server-side only. Never `NEXT_PUBLIC_` — see above and docs/SECURITY.md.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # `wwtp_ui`, which is a `LOGIN` role in `wwtp_reader` and nothing else. It
      # cannot INSERT, UPDATE, DELETE or TRUNCATE — each proved by attempting it
      # and reading the refusal in `storage/postgres/roles.py::check`.
      #
      # The Node-RED service authenticates as the *owner*, which is the open
      # thread at the top of `docs/LEARNING-LOG.md`. This one is the example of
      # how to close it: the page has no write path at all, so a read-only role
      # costs nothing and is exactly the right grant.
      POSTGRES_USER: ${WEB_DB_ROLE:-wwtp_ui}
      POSTGRES_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
    container_name: wwtp-web
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The app writes nothing. `next start` needs a cache directory and nothing
    # else, and a read-only root filesystem is the cheapest way to make "this
    # service cannot be talked into writing" a property of the container rather
    # than a claim in a comment.
    read_only: true
    tmpfs:
      - /tmp:size=32m
      # `next start` writes its image cache under `.next/cache`, and a
      # read-only root filesystem makes that a startup failure. A tmpfs rather
      # than a writable mount, so the cache is still memory and still discarded
      # on restart — which is correct, because the *build* output is baked in the
      # image and this cache only holds revalidation state.
      - /app/.next/cache:size=64m
    ports:
      - "${HOST_BIND:-127.0.0.1}:${WEB_PORT:-3001}:3000"
    networks: [plant]
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    healthcheck:
      # `/api/health`, not `/`. An open port proves the process bound a socket;
      # the endpoint runs `SELECT 1`, so "healthy" means the page can reach the
      # database — which is the failure an operator needs told about.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  # Profile: observability — Grafana, for the dashboards you did not write by hand
  # ═══════════════════════════════════════════════════════════════════════════
  grafana:
    <<: *restart
    image: grafana/grafana:11.5.1
    container_name: wwtp-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Dashboard provisioning from the mounted directory, so a dashboard is a
      # reviewed file in git rather than something exported by hand.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_INSTALL_PLUGINS: ""
      # Grafana reads the hypertable through Timescale's Postgres datasource,
      # which is a first-party plugin and needs no configuration beyond this.
      POSTGRES_HOST: db:5432
      POSTGRES_USER: ${POSTGRES_USER:-wwtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
    volumes:
      - ./ui/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ui/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${HOST_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    networks: [plant]
    depends_on:
      db:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully

  # ═══════════════════════════════════════════════════════════════════════════
  # Profile: demo — seed history so the dashboards are not empty on first load
  # ═══════════════════════════════════════════════════════════════════════════
  seed:
    <<: *python-service
    # A seeder that restarts on failure would seed the same window repeatedly.
    # Exiting non-zero is the signal; restarting it is not the response.
    restart: "no"
    container_name: wwtp-seed
    profiles: ["demo"]
    command:
      - python
      - -m
      - storage.seed.main
      - --days=${SEED_DAYS:-7}
      - --storm-after=${DEMO_STORM_AT_HOURS:-2}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-wwtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wwtp}
      SEED_DAYS: ${SEED_DAYS:-7}
      DEMO_STORM_AT_HOURS: ${DEMO_STORM_AT_HOURS:-2}
    networks: [plant]
    depends_on:
      init-db:
        condition: service_completed_successfully

# ─────────────────────────────────────────────────────────────────────────────
# Networks
#
# `plant` is a user-defined bridge, not the default. On a user-defined network
# Docker resolves *service names* via its embedded DNS — so the gateway can say
# `db:5432` and mean it. On the default bridge it would mean 127.0.0.1 and fail
# in a way that reads like a network fault.
#
# It is `internal: false` because the containers need outbound access to resolve
# and, for the seeder, to reach nothing at all — but the soft PLC should not have
# egress in a real plant. See docs/SECURITY.md.
# ─────────────────────────────────────────────────────────────────────────────
networks:
  plant:
    name: wwtp-plant
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Volumes — all named, never bind mounts for data.
#
# A bind mount ties the database to a path on one developer's machine and its
# ownership. A named volume is created by Docker, owned correctly, and portable.
# `docker compose down` keeps them; `down -v` deletes the data, deliberately.
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  db-data:
  gateway-spool:
  grafana-data:

