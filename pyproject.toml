[project]
name = "wwtp-iiot"
version = "0.1.0"
description = "Industrial IIoT monitoring for a simulated wastewater treatment plant"
readme = "README.md"
# The upper bound is not caution, it is arithmetic. uv resolves an *open* range
# against every future Python too, so ">=3.13" made the solve fail on 3.15,
# where couchbase>=4.9 does not exist yet — a resolution error about a Python
# version nobody here is running.
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }  # portfolio project; no OSS licence granted

# Runtime dependencies are intentionally minimal in Phase 1.
# Added as the phases that need them begin:
#   Phase 2: asyncua, pymodbus
#   Phase 3: fastapi, uvicorn, psycopg, psycopg-pool
#   Phase 4: (none beyond the above)
#   Phase 5: (Next.js is separate, ui/web)
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed for Phases 1-2. Install with: uv sync --extra protocols
protocols = [
    "asyncua>=1.1",
    # PINNED. 3.15 replaced ModbusSlaveContext with ModbusDeviceContext, removed
    # the sequential block's getValues/setValues, and made
    # ModbusServerContext serve only ModbusSimulatorContext. The register model
    # in softplc/servers/modbus.py is deliberately free of this dependency, so
    # this pin is the only place a library upgrade can cause rework.
    "pymodbus==3.6.6",
]
storage = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Postgres + TimescaleDB, replacing influxdb-client and couchbase.
    #
    # Not "because it has more SQL", though it does. The measured reasons are in
    # docs/DESIGN.md: the tag-column model was standing in for a relation the
    # database could have enforced, InfluxQL has no CASE, IN, HAVING, INTERVAL or
    # scalar subqueries, a table's schema is fixed by its first write and never
    # released, and the query planner is non-deterministic on Core.
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
analysis = [
    # The analyst-notebook series (`notebooks/`). Separate from `storage` and
    # from the runtime: nothing in the plant imports these, and the plant's image
    # must not grow by 60 MB because a notebook needs a plotting library.
    #
    # pandas is here because the audience is fluent in it, not because anything
    # here teaches it. numpy arrives with it.
    "pandas>=2.2",
    "matplotlib>=3.9",
    # seaborn for distributions and heatmaps only. `notebooks/_style.py`
    # documents the hard rule that `sns.lineplot` is never used on this data: it
    # aggregates repeated x-values into a mean and a CI band, which erases the
    # irregular sampling structure these notebooks exist to examine.
    "seaborn>=0.13",
    # Executing the notebooks in CI. `nbmake` rather than `nbval` on purpose:
    # these notebooks assert inside themselves (plain `assert`, in prose and code
    # cells) rather than against stored output, because the database is re-seeded
    # and any pinned output would be stale on arrival.
    "nbmake>=1.5",
    "ipykernel>=6.29",
    # The front-end. In its own extra `notebooks-serve` rather than in `analysis`,
    # because CI executes notebooks headlessly and needs none of this: jupyterlab
    # is ~40 MB of server that a gate never starts.
    #
    # It is worth the separation for a specific reason. A `jupyter` already on
    # PATH — from a system Python, anaconda, pyenv — will happily open a notebook
    # in this repository and run it under the *wrong interpreter*, which has no
    # psycopg and no pandas. The failure is a ModuleNotFoundError on cell one, and
    # it reads like the project is broken. Installing Jupyter into the venv means
    # `uv run jupyter lab` and the project's dependencies are the same environment
    # by construction.
]
serve = [
    "jupyterlab>=4.2",
]
workshop = [
    # The machine-learning workshop (`workshops/ml/`). Its own extra for the same
    # reason `analysis` is: nothing in the plant imports it, and the plant's image
    # must not grow because a workshop needs a classifier.
    #
    # `torch` is deliberately NOT here yet. Day 2's sequence tier needs it, that
    # tier is not written, and a CPU-only torch wheel is ~200 MB -- an extra that
    # nothing imports is a 200 MB download nobody asked for. It arrives with the
    # notebooks that need it.
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["softplc", "gateway", "storage", "alarms", "tools"]

# A workspace with no members: this is a single root package, and the
# subdirectories are plain packages inside it, not separate distributions.
# Listing them as members made `uv run` fail outright, because a member without
# its own pyproject.toml is an error, not a convenience.
[tool.uv.workspace]
members = []

# ─── tooling ──────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["softplc", "gateway", "storage", "alarms", "tools", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # return
    "PTH",       # pathlib
    "ARG",       # unused arguments
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",  # too many arguments — control blocks legitimately have many
    "PLR2004",  # magic value comparison — used intentionally in process physics
    "N802",     # function name should be lowercase — PLC blocks use domain names
    "N803",     # argument name should be lowercase — see N802
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
# The notebook style module imports inside functions on purpose. Every notebook
# imports it, and `signal_meta()` must not pull matplotlib into a process that
# only wants a unit string — so the heavy imports are deferred to the call that
# needs them. `numpy`/`pandas` inside `describe()` are the same argument at a
# smaller scale. The alternative is a module whose import costs a second and
# whose purpose is to be cheap.
"notebooks/_style.py" = ["PLC0415"]
# The notebook tooling imports nbformat/nbclient inside `main()` and the storage
# helpers inside a function, on purpose: `check_notebooks` is imported by the test
# suite for its claim parser, and paying a notebook stack's import cost to check a
# string is the wrong trade.
"tools/check_notebooks.py" = ["PLC0415", "BLE001"]
# Lazy imports are a design decision in these files, not an oversight. The psycopg
# driver must stay optional so the protocol code, the process model and the
# deadband/spool logic all remain importable and testable without the storage
# extras installed. That is the whole reason `storage/postgres/writer.py` takes an
# `execute` callable instead of a connection: the buffering *policy* — when to
# flush, what happens on failure, what gets counted — is the part worth testing,
# and it is testable with a list.
"storage/postgres/writer.py" = ["PLC0415"]
"storage/postgres/schema.py" = ["PLC0415"]
# The seeder imports the transport lazily so that replaying the plant - which is
# the interesting half, and needs no database - can be tested directly.
"storage/seed/main.py" = ["PLC0415"]
# Tests import inside a test body when the import is only that one test's
# business: `datetime` to check a row's timestamp representation, `psycopg` to
# name an exception class, `softplc.contract` to enumerate the quality codes.
# Hoisting them to module level would mean importing a database driver into a
# suite that has to run without one.
"tests/integration/*" = ["PLC0415"]
"tests/test_postgres_schema.py" = ["PLC0415"]
"tests/test_postgres_writer.py" = ["PLC0415"]
"tests/test_scanloop.py" = ["PLC0415"]
"tests/test_alarm_detectors.py" = ["PLC0415"]
"tests/test_alarm_rules.py" = ["PLC0415"]
"tests/test_scada_contract.py" = ["PLC0415"]
"tests/test_grafana_dashboards.py" = ["PLC0415"]
"sql/*" = ["ALL"]
# `main()` in both of these is a CLI: argparse, a connection, a loop, and an
# error path for each of four ways the database can say no. Splitting it up would
# move the branches around without reducing them, and a checker you have to read
# in one screen is worth more than one with fewer lines.
"tools/sqlrun.py" = ["PLC0415", "PLR0912", "PLR0915"]
"tools/check_sql.py" = ["PLC0415", "PLR0912", "PLR0915"]
# RUF002: the detection-vocabulary tables in alarms/rules.py and base.py are
# aligned ASCII, and an en dash in an aligned column breaks the alignment. The
# hyphens are the readable choice, not an accident.
"alarms/rules.py" = ["RUF002", "PLC0415"]
"alarms/base.py" = ["RUF002"]
# The alarm package imports psycopg and the storage module lazily, so that the
# detectors — which are the part the course and the tests care about — can be
# imported and exercised without the storage extras installed. Same reasoning as
# `storage/postgres/writer.py`.
"alarms/main.py" = ["PLC0415"]
"alarms/scenarios.py" = ["PLC0415"]
"alarms/store.py" = ["PLC0415"]
# `tune` imports the plant model and the detectors together, and the detectors
# are the half that must stay importable without the storage extras.
"alarms/tune.py" = ["PLC0415"]
# `replay()` is a pure function of the event rows and imports nothing from
# storage, so the awkward cases are testable with no database. The two
# database-touching entry points import lazily for that reason.
"alarms/replay.py" = ["PLC0415"]
# The two database-touching tests import `storage.postgres.schema` lazily, so the
# other twenty run with no database and no storage extras installed. Same
# reasoning as `tests/integration/`, and it is why 21 of these 22 are green on a
# machine that has never run Postgres.
"tests/test_web_page.py" = ["PLC0415"]
"storage/postgres/roles.py" = ["PLC0415"]
"storage/postgres/login_role.py" = ["PLC0415"]
# `_evaluate_one` is a state machine with one branch per state; splitting it up
# would put each branch further from the transitions it feeds. The lazy import is
# so the module stays importable without the storage extras.
"alarms/engine.py" = ["PLR0911", "PLC0415"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# The soft PLC is deliberately typed as strictly as a PLC would be, but the
# process model uses float math from sensors that are inherently noisy.
allow_redefinition = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "contract: tests that validate contracts/tags.yaml against consumers",
    "sql: the course's SQL, checked against a live Postgres",
    "integration: tests requiring running services",
    "chaos: tests that deliberately break things",
    "slow: tests taking more than a few seconds",
]
